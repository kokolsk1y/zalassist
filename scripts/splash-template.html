<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #1E3A6E;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .logo {
    width: 60%;
    max-width: 480px;
    background: white;
    padding: 24px 32px;
    border-radius: 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  .logo img { width: 100%; display: block; }
  .label {
    color: rgba(255,255,255,0.85);
    font-size: 18px;
    margin-top: 28px;
    letter-spacing: 0.02em;
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="logo"><img src="../static/logo.png" alt="ЭлектроЦентр"></div>
  <div class="label">Помощник в торговом зале</div>
</body>
</html>
