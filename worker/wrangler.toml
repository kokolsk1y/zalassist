name = "zalassist-api"
main = "index.js"
compatibility_date = "2025-01-01"

# Свободный план Cloudflare Workers: 100 000 запросов/день, 10 ms CPU/request.
# Прокси к OpenRouter — почти весь wall-clock уходит на network wait, а не CPU.
# При превышении лимита Worker возвращает 429.

# Secrets (задаются через `wrangler secret put`, не лежат в файле):
#   OPENROUTER_API_KEY  — ключ OpenRouter, тот же что в Yandex Function
#   PROXY_TOKEN         — shared secret между Yandex CF и Worker для ауth
