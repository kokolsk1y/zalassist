<!doctype html>
<html lang="ru" data-theme="electrocentr">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/pwa-192x192.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="ЭлектроЦентр" />

		<!-- iOS apple-touch-startup-image: точные размеры под популярные iPhone (портрет).
		     Без этого iOS показывает белый экран ~1с при запуске PWA. -->
		<link rel="apple-touch-startup-image" href="%sveltekit.assets%/splash/splash-1320x2868.png"
			media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
		<link rel="apple-touch-startup-image" href="%sveltekit.assets%/splash/splash-1206x2622.png"
			media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
		<link rel="apple-touch-startup-image" href="%sveltekit.assets%/splash/splash-1290x2796.png"
			media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
		<link rel="apple-touch-startup-image" href="%sveltekit.assets%/splash/splash-1179x2556.png"
			media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
		<link rel="apple-touch-startup-image" href="%sveltekit.assets%/splash/splash-1284x2778.png"
			media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
		<link rel="apple-touch-startup-image" href="%sveltekit.assets%/splash/splash-1170x2532.png"
			media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
		<link rel="apple-touch-startup-image" href="%sveltekit.assets%/splash/splash-1125x2436.png"
			media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
		<link rel="apple-touch-startup-image" href="%sveltekit.assets%/splash/splash-1242x2688.png"
			media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
		<link rel="apple-touch-startup-image" href="%sveltekit.assets%/splash/splash-828x1792.png"
			media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
		<link rel="apple-touch-startup-image" href="%sveltekit.assets%/splash/splash-750x1334.png"
			media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="theme-color" content="#1E3A6E" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0F1F3F" media="(prefers-color-scheme: dark)" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
